server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name software.qiaomu.ai;
    ssl_certificate /etc/letsencrypt/live/software.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/software.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QIAOMU_SOFTWARE_SSL:1m;
    ssl_session_timeout 1d;
    client_max_body_size 12m;
    client_body_timeout 25s;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3268;
        proxy_set_header Host software.qiaomu.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_read_timeout 35s;
    }
}
